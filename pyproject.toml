[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.14"
dependencies = [
    "fastapi==0.129.0",
    "uvicorn==0.40.0",
    "httpx==0.28.1",

    "anthropic==0.79.0",
    "openai==2.21.0",

    "opentelemetry-api==1.39.1",
]

[dependency-groups]
dev = [
    "black",
    "flake8",
    "isort",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
]
