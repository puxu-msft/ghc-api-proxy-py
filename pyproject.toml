[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app"
version = "0.1.0"
description = "High-performance multi-protocol proxy for GitHub Copilot-backed LLM APIs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles",
    # Floors here are compatibility facts, not taste.
    # anthropic 1.0 is the release that stopped accepting an `httpx.AsyncClient` at all; openai 3.0 made httpx2 its default and calls its remaining legacy path temporary; httpx2 2.6 is where `AsyncClient.websocket()` appears and 2.12 is the connection-pool behaviour `app.upstream.stream_cap` was measured against; opentelemetry-instrumentation-httpx 0.65b0 is where `HTTPX2ClientInstrumentor` appears.
    # starlette is named here even though fastapi pulls it in, because we import it directly and because its TestClient only prefers httpx2 from 1.2.0 — 1.2.1 fixed the type-checking branch that still said httpx. fastapi asks merely for `starlette>=0.46`, so leaving this implicit resolves to 0.52.1 and every TestClient dies on the missing httpx.
    # See .dev/docs/httpx2-migration/plan.md.
    "anthropic>=1",
    "anyio",
    "fastapi>=0.141",
    "httpx2[http2,socks,ws]>=2.12",
    "openai>=3",
    "opentelemetry-api",
    "opentelemetry-exporter-prometheus",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-sdk",
    "orjson",
    "platformdirs",
    "pydantic",
    "pydantic-settings[yaml]",
    "starlette>=1.2.1",
    "structlog",
    "textual",
    "tiktoken",
    "typer",
    "uvicorn",
    "cryptography>=50.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pyright",
    # Only `tests/tui/` needs it: a terminal emulator that turns the footer's byte stream back into a screen grid plus scrollback. Asserting on the bytes instead would not catch a footer that lands on top of a log line, which is the whole failure mode.
    "pyte",
    "ruff",
    # Only `tests/int/recorded/from_history.py` needs it: the copilot-api history database
    # stores its objects zstd-compressed. Nothing the proxy itself runs touches this.
    "zstandard",
]

[project.scripts]
ghc-api-proxy = "app.cli:main"

[tool.pytest.ini_options]
# tests/tui is excluded from the default sweep and has its own entry; see tests/tui/conftest.py.
# `--ignore` only drops it from directory discovery, so naming the path still runs it.
addopts = "--strict-markers --strict-config --ignore=tests/tui --ignore=tests/e2e"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Prose is never hard-wrapped here, so a column limit on comments and docstrings only fights the house style. Ruled 2026-08-19. `line-length` above still governs what the formatter would do to code, and `ruff format` remains banned regardless (see .claude/rules/00-development-workflow.md).
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]
