[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app"
version = "0.1.0"
description = "High-performance multi-protocol proxy for GitHub Copilot-backed LLM APIs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles",
    "anthropic",
    "anyio",
    "fastapi",
    "httpx[http2,socks]",
    "httpx-ws",
    "openai",
    "opentelemetry-api",
    "opentelemetry-exporter-prometheus",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-sdk",
    "orjson",
    "platformdirs",
    "pydantic",
    "pydantic-settings[yaml]",
    "structlog",
    "textual",
    "tiktoken",
    "typer",
    "uvicorn",
    "cryptography>=50.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pyright",
    "ruff",
]

[tool.pytest.ini_options]
# tests/tui is excluded from the default sweep and has its own entry; see tests/tui/conftest.py.
# `--ignore` only drops it from directory discovery, so naming the path still runs it.
addopts = "--strict-markers --strict-config --ignore=tests/tui"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]
