# ghc-api-proxy 配置文档 / Configuration
#
# 配置生效的典型优先级：
#   1. CLI 参数（如有）
#   2. 环境变量（如有）
#   3. 配置文件中的值。配置文件的路径来自
#      1. CLI --config 参数
#      2. $XDG_DATA_HOME/ghc-api-proxy/config.yaml (默认是 ~/.local/share/ghc-api-proxy/config.yaml)
#   4. 发布包内置的 config.yaml
#   5. 代码中内置的默认值
#
# Typical priority of effective configuration:
#   1. CLI options (if any)
#   2. Environment variables (if any)
#   3. Config file. Path comes from
#      1. CLI --config option
#      2. $XDG_DATA_HOME/ghc-api-proxy/config.yaml (Default: ~/.local/share/ghc-api-proxy/config.yaml)
#   4. Bundled config.yaml in the dist package
#   5. Hard-coded defaults in the code
#
# 本文件中的是作者调优的值，尽可能只摘取、覆盖你需要的部分到用户配置中。
# Values in this file are author-tuned; try to only copy/override what you need into your user config.
#
# 除非另有说明，所有设置均支持热重载。 / All settings are hot-reloadable unless noted otherwise.

# ============================================================================
# 客户端入站 / Client, inbound, ingress
# ============================================================================

server:

  # 监听地址与端口。默认仅本机可访问。
  # Listen address and port. Default is localhost-only.
  #
  # 不支持热重载（需重启） / Not hot-reloadable (requires restart).
  #
  host: 127.0.0.1
  port: 4142

  tls:
    # 模式
    #   false  = 仅 HTTP
    #   true   = 仅 HTTPS
    #   "both" = 同一端口同时接受 HTTP 与 HTTPS（按连接首字节分流，0x16 = TLS ClientHello）
    #
    # Mode
    #   false  = HTTP only
    #   true   = HTTPS only
    #   "both" = Accept both HTTP and HTTPS on the SAME port (first-byte peek, 0x16 = TLS ClientHello)
    #
    mode: both

    # PEM 证书与私钥文件路径，必须成对给出。
    # 两者都省略时会在 <配置目录>/tls/ 下生成一份自签名证书并复用（删掉该目录即重新生成）。
    #
    # PEM certificate + private key files. Must be set together.
    # Omit both and a self-signed pair is generated once into <config-dir>/tls/ and reused (delete that directory to regenerate).
    # cert: /path/to/cert.pem
    # key: /path/to/key.pem

    # 是否真的校验证书？默认除了「能读到」之外不对证书做任何校验——这是本地开发用代理，不构成拒绝启动的理由。
    # Whether to actually verify certificates. Default is to only "be able to read" without any cert validation — this is a local dev proxy, not a reason to refuse startup.
    strict: false

inbound:
  # GHC API 提供分词计数器 `POST /v1/messages/count_tokens`，这里控制是否使用它。
  # The GHC API provides a token counter `POST /v1/messages/count_tokens`, this controls whether to use it.
  anthropic_count_tokens:
    # local = 本地 calibrated tiktoken 估算。
    # local = local calibrated tiktoken estimate.
    providers: [ghc, local]
    max_retries: 2

# 模型名映射：请求模型 → 目标模型。
# Model name mappings: request model → target model.
#
# 注意：这是模型名映射的唯一来源——没有任何内置默认值。
# This is the SOLE source of model-name mapping — there are no built-in defaults.
#
# 大小写不敏感。 / Keys/values are spelling-insensitive.
#
# Anthropic 模型名兼容处理："." 与 "-" 可互换。
#   例如，入站 "claude-opus-4-5" 可命中下述规则：
#     claude-opus-4.5: claude-opus-4.8
#
# Anthropic 模型名兼容处理：剥离 "[1m]" 后缀。
#   例如，入站 "opus[1m]" 可命中下述规则（按顺序尝试）：
#     opus-1m: claude-opus-4.8
#     opus: claude-opus-4.8
#
# Anthropic-compatible model name resolver: "." and "-" are interchangeable
#   For example, ingress "claude-opus-4-5" can hit the following rule:
#     claude-opus-4.5: claude-opus-4.8
#
# Anthropic-compatible model name resolver: strip "[1m]" suffix
#   For example, ingress "opus[1m]" can hit the following rules (in order):
#     opus-1m: claude-opus-4.8
#     opus: claude-opus-4.8
#
# 若目标在可用模型列表中，直接解析命中；否则，当作别名再次尝试解析；仍不可用则放弃映射、直接透传（上游随后拒绝它）。
# If a target is in the available models list, it is resolved directly; otherwise, it is treated as an alias and resolved again;
# if still unavailable, the mapping is abandoned and passed through (the upstream then rejects it).
#
model_mappings:

  # 短别名必须指定，否则会被直接透传给上游并被拒绝。
  # Short aliases must be set; an unmapped alias is sent upstream as-is and rejected.

  # 使用最新版本 / Use latest version
  #

  fable: claude-opus-5
  claude-fable-5: claude-opus-5

  opus: claude-opus-5
  claude-opus-4.1: claude-opus-5
  claude-opus-4.5: claude-opus-5
  claude-opus-4.6: claude-opus-5
  claude-opus-4.7: claude-opus-5

  sonnet: claude-sonnet-5
  claude-sonnet-4.5: claude-sonnet-5
  claude-sonnet-4.6: claude-sonnet-5

  # haiku: claude-haiku-4.5

  # 使用 GPT 系列 / Use GPT series
  #

  gpt: gpt-5.6-sol
  gpt-5.5: gpt-5.6-terra

  haiku: gpt-5.6-luna
  claude-haiku-4.5: gpt-5.6-luna

  # Anthropic 模型名兼容处理：日期后缀 / Anthropic-compatible model name resolver: date-suffix
  #
  # 自 2026/07/16 起，不再自动剥离日期后缀 "-YYYYMMDD"，必须显式配置。
  # Since 2026/07/16, date-suffix "-YYYYMMDD" is no longer internally stripped; must be explicitly set.
  #
  claude-opus-4-5-20251101: claude-opus-5
  claude-opus-4-1-20250805: claude-opus-5
  claude-haiku-4-5-20251001: gpt-5.6-luna
  claude-sonnet-4-5-20250929: claude-sonnet-5

# ============================================================================
# 模型提供者 / Model Providers
# ============================================================================

model_providers:
  ghc:
    type: github_copilot

    # 显式指定上游 GitHub Copilot API 基础 URL。
    # Explicit upstream GitHub Copilot API base URL.
    # api_base_url: "https://api.githubcopilot.com"

    # GitHub Token 文件路径。
    # GitHub Token file path.
    #
    # 不支持热重载（需重启）。 / Not hot-reloadable (requires restart).
    #
    github_token_file: "$XDG_DATA_HOME/ghc-api-proxy/github_token.txt"

    # 后台刷新模型列表（保持 `GET /models` 缓存新鲜）的间隔秒数（0 = 禁用）。
    # Seconds between background model list refreshes (To keep `GET /models` cache fresh) (0 = disabled).
    model_refresh_interval: 3600

    # 禁用模型，即便上游仍在对外提供它们。只匹配上游 `model.id`。
    # Disable models even if upstream still advertises them. Match is exact against `model.id`.
    #
    disabled_models:
