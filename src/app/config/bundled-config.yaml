# 随包默认配置 / Configuration shipped with the package.
#
# 它只写「没有它服务就起不来」的那几项，其余一律交给 `app.config.schema` 的默认值——在这里重复一遍 schema 默认值，等于把同一个事实放到两个地方各自维护，迟早漂移。
#
# 用户配置**叠加**在本文件之上，而不是取代它。所以一份只写了 `server.port` 的用户配置仍然有 provider 可用。要覆盖下面任何一项，在自己的 config.yaml 里写同名键即可。
#
# 完整的、带注释的配置样例见 `docs/.human-controlled/config.example.yaml`。

model_mappings:

  # 短别名必须指定，否则会被直接透传给上游并被拒绝。
  # Short aliases must be set; an unmapped alias is sent upstream as-is and rejected.

  # 使用最新版本 / Use latest version
  #

  fable: claude-opus-5
  claude-fable-5: claude-opus-5

  opus: claude-opus-5
  claude-opus-4.1: claude-opus-5
  claude-opus-4.5: claude-opus-5
  claude-opus-4.6: claude-opus-5
  claude-opus-4.7: claude-opus-5

  sonnet: claude-sonnet-5
  claude-sonnet-4.5: claude-sonnet-5
  claude-sonnet-4.6: claude-sonnet-5

  # haiku: claude-haiku-4.5

  # 使用 GPT 系列 / Use GPT series
  #

  gpt: gpt-5.6-sol
  gpt-5.5: gpt-5.6-terra

  haiku: gpt-5.6-luna
  claude-haiku-4.5: gpt-5.6-luna

  # Anthropic 模型名兼容处理：日期后缀 / Anthropic-compatible model name resolver: date-suffix
  #
  # 自 2026/07/16 起，不再自动剥离日期后缀 "-YYYYMMDD"，必须显式配置。
  # Since 2026/07/16, date-suffix "-YYYYMMDD" is no longer internally stripped; must be explicitly set.
  #
  claude-opus-4-5-20251101: claude-opus-5
  claude-opus-4-1-20250805: claude-opus-5
  claude-haiku-4-5-20251001: gpt-5.6-luna
  claude-sonnet-4-5-20250929: claude-sonnet-5

# 至少要有一个 provider：`model_providers` 的 schema 默认是空字典，而路由在能力上 fail-closed——没有 provider 时每个请求都会被拒。
model_providers:
  ghc:
    type: github_copilot

default_model_provider: ghc

# 上游会拒收、因此必须在发出前删掉的 `cache_control` 子字段，按模型点名。
# `cache_control` subfields this upstream refuses, named per model.
#
# 它写在这里而不是 schema 默认值里，理由和上面 `model_mappings` 一样：这是**运维知识**（某个部署的某些模型拒收某些字段），不是代码的默认行为。上游哪天开始支持了，删掉一行即可，不必等一次发布。
#
# 键是**正则**，`fullmatch` 匹配 resolved model，首个命中者生效——与 `strip_anthropic_beta_flags` 同构，注意 `.` 是通配符。值是该模型拒收的字段名，**大小写敏感**（它们是 JSON 键，不是 HTTP 头）。
#
# **点名拦截，不是白名单**：没被点到的字段一律原样发出。代价是下一个新字段不会被这张表挡住，会一路发到上游并让整条请求 400——止血是在这里加一行，而不是改代码。
# 完整的取舍记录见 `.dev/docs/anthropic-direct-request-shape/spec.md` §7.2。
#
# `scope`：由 `prompt-caching-scope-2026-01-05` beta 引入，新版 Claude Code 会发。
# 2026-08-24 实测，目录里 7 个 Claude 模型（opus-5 / 4.8 / 4.7 / 4.6、sonnet-5 / 4.6、haiku-4.5）**全部**拒收它，每个模型的正控制都是 200；同一轮里 `ttl` 全部被接受，所以 `ttl` 不在表里。
# 补发那个 beta 头也救不回来——网关收下 beta，后端 schema 仍然拒收它启用的字段。
hook_fix_anthropic_request:
  cache_control_sanitize:
    claude-.*:
      - scope
